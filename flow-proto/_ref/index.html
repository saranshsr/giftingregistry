    SCREENS[s.id].layers.filter(l => l.avoidKeyboard).forEach(l => {
      const node = s.ctx.nodes[l.el]?.el || s.ctx.nodes[l.el] || s.ctx.nodes[l.widget]?.el;
      node.style.transition = open ? `opacity 160ms ${EASE_IN}, translate 200ms ${EASE_IN}`
                                   : `opacity 240ms ${EASE_OUT}, translate 320ms ${EASE_OUT}`;
      node.style.opacity = open ? 0 : '';
      node.style.translate = open ? '0 12px' : '';
      node.style.pointerEvents = open ? 'none' : '';
    });
  }
});

function dismissKeyboard(instant = false) {
  keyboard.field?.blur();
  if (document.activeElement === proxyInput || document.activeElement?.closest?.('.r3-date')) document.activeElement.blur();
  if (instant) keyboard.reset();
}

// tapping anywhere else on the phone (outside a field or the keyboard) closes the keyboard, as on iOS
phone.addEventListener('pointerdown', e => {
  if (keyboard.field && !e.target.closest('.tf, .kb, .reg-footer')) keyboard.field.blur();
}, true);

function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('on'), 1600);
}

function anim(el, frames, ms, easing) {
  if (reduceMotion) ms = 1;
  const a = el.animate(frames, { duration: ms, easing, fill: 'forwards' });
  // background tabs can stall the animation clock; never leave navigation locked
  setTimeout(() => { if (a.playState === 'running') a.finish(); }, ms + 150);
  return a.finished;
}

function pos(screenId, name) {
  const p = LAYOUT[screenId]?.[name];
  if (!p) console.warn('missing layout', screenId, name);
  return p || { x: 0, y: 0, w: 0, h: 0 };
}

function place(node, p, dx = 0, dy = 0) {
  Object.assign(node.style, { left: p.x - dx + 'px', top: p.y - dy + 'px', width: p.w + 'px', height: p.h + 'px' });
}

function img(src) {
  const i = new Image();
  i.src = src;
  i.alt = '';
  i.draggable = false;
  i.decoding = 'async';
  return i;
}

// Builds one element (static image or tappable button) for a screen or sheet
function buildLayer(assetDir, layoutId, layer, ctx, dx = 0, dy = 0) {
  const p = pos(layoutId, layer.el);
  const src = name => (name === layer.el && layer.src) || `assets/${layer.dir || assetDir}/${name}.png`;
  let node;
  if (layer.tap || layer.label) {
    node = document.createElement('button');
    node.type = 'button';
    node.className = 'tap' + (layer.tap ? '' : ' todo') + (layer.states ? ' stack' : '') + (layer.baked ? ' baked' : '');
    node.title = layer.label || layer.el;
    node.appendChild(img(src(layer.el)));
    if (layer.states) {
      for (const [key, name] of Object.entries(layer.states)) {
        const alt = img(src(name));
        alt.dataset.state = key;
        alt.style.opacity = 0;
        node.appendChild(alt);
      }
    }
    node.addEventListener('click', e => {
      e.stopPropagation();
      runTap(layer, ctx);
    });
  } else {
    node = img(src(layer.el));
    node.className = 'el';
  }
  node.dataset.el = layer.el;
  place(node, p, dx, dy);
  return node;
}

function runTap(layer, ctx) {
  const t = layer.tap;
  if (!t) return toast(`“${layer.label || layer.el}” isn’t wired yet`);
  if (busy) return;
  if (t === 'back') return back();
  if (typeof t === 'function') return t(ctx);
  if (t.sheet) return openSheet(t.sheet);
  if (t.to) return go(t.to);
  if (t.reset) return resetTo(t.reset);
}

function makeCtx(id) {
  const ctx = {
    id,
    state: {},
    nodes: {},
    toggle(key, value) {
      ctx.state[key] = ctx.state[key] === value ? null : value;
      SCREENS[id].render?.(ctx);
    },
    setState(elName, key) {
      const node = ctx.nodes[elName];
      if (!node) return;
      node.querySelectorAll('img[data-state]').forEach(i => { i.style.opacity = i.dataset.state === key ? 1 : 0; });
    },
    shake(msg = 'Pick an occasion first') {
      const node = ctx.nodes['cta-disabled'];
      node?.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-6px)' }, { transform: 'translateX(5px)' },
        { transform: 'translateX(-3px)' }, { transform: 'translateX(0)' }], { duration: 320, easing: 'ease-out' });
      toast(msg);
    },
  };
  return ctx;
}

function buildScreen(id, state) {
  const def = SCREENS[id];
  const ctx = makeCtx(id);
  if (state) ctx.state = state;   // a step rebuilt with the answers it already had (stepBack)
  const el = document.createElement('div');
  el.className = 'screen';
  el.style.background = def.bg;

  const scroller = document.createElement('div');
  scroller.className = 'scroller';
  const content = document.createElement('div');
  content.className = 'content';
  content.style.height = (def.height || 812) + 'px';
  scroller.appendChild(content);
  ctx.content = content;

  const fixed = document.createElement('div');
  fixed.className = 'fixed';
  // an 812pt-tall box pinned to the frame's bottom, so sticky CTAs and tab bars keep their
  // design coordinates but follow the bottom edge when the frame is shorter or taller than 812
  const fixedBottom = document.createElement('div');
  fixedBottom.className = 'fixed fixed-bottom';
  const fixedFor = layer => (layer.dock === 'bottom' || (layer.el && pos(id, layer.el).y >= 406)) ? fixedBottom : fixed;

  // fixed layers flagged `under` sit behind the scrolling content (e.g. background pattern)
  const under = document.createElement('div');
  under.className = 'fixed';
  under.style.zIndex = 0;

  if (def.header) {
    const fade = document.createElement('div');
    fade.className = 'header-fade';
    Object.assign(fade.style, { height: def.header.h + 'px', background: def.header.bg, opacity: def.header.always ? 1 : 0 });
    fixed.appendChild(fade);
    const after = def.header.after ?? 4;
    if (!def.header.always) scroller.addEventListener('scroll', () => { fade.style.opacity = scroller.scrollTop > after ? 1 : 0; }, { passive: true });
  }

  for (const layer of def.layers) {
    if (layer.widget) {
      const w = WIDGETS[layer.widget](ctx, layer);
      ctx.nodes[layer.widget] = w;
      if (layer.part) w.el.dataset.part = layer.part;
      (layer.fixed ? fixedFor(layer) : content).appendChild(w.el);
      continue;
    }
    if (layer.strip) {
      const s = layer.strip;
      const strip = document.createElement('div');
      strip.className = 'strip';
      Object.assign(strip.style, { top: s.y + 'px', height: s.h + 'px' });
      const inner = document.createElement('div');
      inner.className = 'strip-inner';
      inner.style.width = s.width + 'px';
      for (const item of layer.items) {
        const node = buildLayer(id, id, item, ctx, 0, s.y);
        ctx.nodes[item.el] = node;
        inner.appendChild(node);
      }
      strip.appendChild(inner);
      if (layer.id) ctx.nodes[layer.id] = strip;
      (layer.fixed ? fixed : content).appendChild(strip);
      continue;
    }
    const node = buildLayer(id, id, layer, ctx);
    ctx.nodes[layer.el] = node;
    if (layer.part) node.dataset.part = layer.part;
    (layer.under ? under : layer.fixed ? fixedFor(layer) : content).appendChild(node);
  }

  // Clicking outside a hotspot flashes them, like Figma prototypes
  el.addEventListener('click', () => {
    el.classList.add('flash');
    setTimeout(() => el.classList.remove('flash'), 450);
  });

  el.append(under, scroller, fixed, fixedBottom);
  def.render?.(ctx);
  return { id, el, ctx };
}

// Staggered fade-up for elements listed in `enter`
function playEnter(entry, delay = 0) {
  const names = SCREENS[entry.id].enter;
  if (!names || reduceMotion) return;
  names.forEach((name, i) => {
    const node = entry.ctx.nodes[name];
    node?.animate([{ opacity: 0, transform: 'translateY(14px)' }, { opacity: 1, transform: 'none' }],
      { duration: 480, delay: delay + i * 60, easing: EASE_OUT, fill: 'backwards' });
  });
}

// My Lists page load: the existing collections slide one slot right and the
// "Start a gift list" card drops into the gap at the front of the tray
const LIST_SLOT = 142;
function pushNewListCard(ctx, delay = PUSH_MS * 0.7) {
  const card = ctx.nodes['list-new'];
  const cards = [...card.parentElement.querySelectorAll('.host-reg'), ...['list-1', 'list-2', 'list-3'].map(n => ctx.nodes[n])];
  // scroll-snap would otherwise follow the snapped Lamps card and scroll the tray along with it
  const strip = card.closest('.strip');
  strip.style.scrollSnapType = 'none';
  setTimeout(() => { strip.scrollLeft = 0; strip.style.scrollSnapType = ''; }, delay + 1400);
  cards.forEach(c => { c.style.translate = `${LIST_SLOT}px 0`; });
  if (reduceMotion) return;
  // slow ease-in-out slide, then the new card settles in without overshoot once the gap has opened
  cards.forEach((c, i) => c.animate([{ translate: '0 0' }, { translate: `${LIST_SLOT}px 0` }],
    { duration: 900, delay: delay + i * 50, easing: 'cubic-bezier(0.45, 0, 0.15, 1)', fill: 'backwards' }));
  card.animate([{ opacity: 0, transform: 'scale(0.92)' }, { opacity: 1, transform: 'none' }],
    { duration: 800, delay: delay + 380, easing: 'cubic-bezier(0.22, 1, 0.36, 1)', fill: 'backwards' });
}

// Resolves once every image on a screen has downloaded and decoded and web fonts are ready.
// (Not window "load": that also waits for the background preload of every other screen.)
// Capped at 4s: a backgrounded tab may never decode, and the card shouldn't wait forever.
function screenLoaded(ctx) {
  const imgs = [...ctx.content.closest('.screen').querySelectorAll('img')];
  const cap = new Promise(r => setTimeout(r, 4000));
  return Promise.race([cap, Promise.all([
    document.fonts?.ready,
    ...imgs.map(i => i.complete
      ? i.decode?.().catch(() => {})
      : new Promise(r => { i.addEventListener('load', r, { once: true }); i.addEventListener('error', r, { once: true }); })
        .then(() => i.decode?.().catch(() => {}))),
  ])]);
}

function current() { return stack[stack.length - 1]; }

const isStep = entry => !!(entry && SCREENS[entry.id]?.step);

async function go(id) {
  if (!SCREENS[id]) return toast(`Screen “${id}” not added yet`);
  if (busy) return;
  const from = current();
  if (SCREENS[id].step && isStep(from)) return stepTo(id);
  // the registry flow rises over the page it starts from, like a sheet
  const modal = !!SCREENS[id].step;
  busy = true;
  dismissKeyboard();
  if (keyboard.native && SCREENS[id].focusOnEnter) focusProxy(SCREENS[id].focusOnEnter);
  const to = buildScreen(id);
  // pushing from a sheet: slide the new screen over it while the sheet drops away
  if (sheet) to.el.style.zIndex = 31;
  phone.insertBefore(to.el, toastEl);
  stack.push(to);
  renderList();
  to.ctx.enterDelay = PUSH_MS * 0.45;
  SCREENS[id].onEnter?.(to.ctx);

  const jobs = [modal
    ? anim(to.el, [{ transform: 'translateY(100%)' }, { transform: 'translateY(0)' }], PUSH_MS * 1.1, EASE_OUT)
    : anim(to.el, [{ transform: 'translateX(100%)', boxShadow: '-12px 0 32px rgba(0,0,0,0)' },
                   { transform: 'translateX(0)', boxShadow: '-12px 0 32px rgba(0,0,0,.12)' }], PUSH_MS, EASE_OUT),
  ];
  if (from) jobs.push(modal
    ? anim(from.el, [{ '--dim': 0 }, { '--dim': 0.12 }], PUSH_MS, EASE_OUT)
    : anim(from.el, [{ transform: 'translateX(0)', '--dim': 0 }, { transform: 'translateX(-30%)', '--dim': 0.12 }], PUSH_MS, EASE_OUT));
  if (sheet) jobs.push(closeSheet(true));
  playEnter(to, PUSH_MS * 0.35);
  await Promise.all(jobs);
  if (from) from.el.classList.add('parked');
  to.el.getAnimations().forEach(a => { a.commitStyles(); a.cancel(); });
  to.el.style.boxShadow = 'none';
  to.el.style.zIndex = '';
  busy = false;
}

async function back() {
  if (sheet) return closeSheet();
  if (busy) return;
  // inside the registry flow, back goes a step back; from step 1 it closes the flow
  // embedded: closing the flow from step 1 hands back to the host app (its wishlist is underneath)
  if (EMBED && !EMBED_START && isStep(current()) && !isStep(stack[stack.length - 2])) return toHost({ type: 'close' });
  if (isStep(current())) return isStep(stack[stack.length - 2]) ? stepBack() : closeFlow();
  // screens reached by a reset have no history; their back leads to the Account page
  if (stack.length < 2) return current()?.id === 'start' ? toast('Start of flow') : resetTo('start');
  busy = true;
  dismissKeyboard();
  const from = stack.pop();
  const to = current();
  renderList();
  to.el.classList.remove('parked');
  await Promise.all([
    anim(from.el, [{ transform: 'translateX(0)' }, { transform: 'translateX(100%)' }], POP_MS, EASE_OUT),
    anim(to.el, [{ transform: 'translateX(-30%)', '--dim': 0.12 }, { transform: 'translateX(0)', '--dim': 0 }], POP_MS, EASE_OUT),
  ]);
  from.el.remove();
  to.el.getAnimations().forEach(a => a.cancel());
  busy = false;
}

// Pop-style exit to a screen that may not be on the stack; history is cleared
async function resetTo(id) {
  if (EMBED && !EMBED_START && (id === 'wishlist2' || id === 'wishlist')) return toHost({ type: 'done' });
  if (busy) return;
  busy = true;
  dismissKeyboard();
  const from = current();
  const to = buildScreen(id);
  phone.insertBefore(to.el, from.el);
  stack.forEach(s => { if (s !== from) s.el.remove(); });
  stack = [to];
  renderList();
  SCREENS[id].onEnter?.(to.ctx);
  await Promise.all([
    anim(from.el, [{ transform: 'translateX(0)' }, { transform: 'translateX(100%)' }], POP_MS, EASE_OUT),
    anim(to.el, [{ transform: 'translateX(-30%)', '--dim': 0.12 }, { transform: 'translateX(0)', '--dim': 0 }], POP_MS, EASE_OUT),
  ]);
  from.el.remove();
  to.el.getAnimations().forEach(a => a.cancel());
  busy = false;
}

// Flow 2 intro on the Account page (Figma "Intro", 8183:451229). 01: the page as usual. 02: the lower page
// washes to white and a big Gift Registries promo card rises, its art popping in piece by piece. 03: the
// card shrinks into the My Lists card, which takes over in its Gift Registries state; it then carries on
// with its own steps: 04 the promo drops away, 05 the thumbnails fan back out.
// The big card's art is the My Lists card's own art × PROMO_K + PROMO_OFF (as in Figma), so it lands exactly.
const PROMO_K = 2.2711, PROMO_OFF = [-7.7, 28.53];
const PROMO_CARD = { x: 12, y: 452, w: 351, h: 348, r: 24 };
function playRegistryIntro(ctx) {
  const w = ctx.nodes.mylists;
  if (reduceMotion) return w.play();
  w.setState('s01');
  const screen = ctx.content.closest('.screen');
  const host = document.createElement('div');
  host.className = 'fixed fixed-bottom reg-intro';   // 812pt tall and pinned to the bottom, like the card in the design
  const fade = host.appendChild(document.createElement('div'));
  fade.className = 'ri-fade';
  const card = host.appendChild(document.createElement('div'));
  card.className = 'ri-card';
  card.title = 'Gift Registries';
  const glow = card.appendChild(document.createElement('div'));
  glow.className = 'ri-glow';
  const art = card.appendChild(document.createElement('div'));
  art.className = 'ri-art';
  const big = `translate(${PROMO_OFF[0]}px, ${PROMO_OFF[1]}px) scale(${PROMO_K})`;
  art.style.transform = big;
  const pieces = w.promo().map(p => {
    const i = art.appendChild(img(p.src));
    Object.assign(i.style, { left: p.x + 'px', top: p.y + 'px', width: p.w + 'px', height: p.h + 'px' });
    return i;
  });
  // the copy also lives in the art layer (small-card pt), so it shrinks with the card; on the way down it
  // moves onto the small card's title and subtitle and cross-fades into them
  const small = ([x, y]) => [(x - PROMO_OFF[0]) / PROMO_K, (y - PROMO_OFF[1]) / PROMO_K];
  const place = (node, b) => Object.assign(node.style, { left: b.x + 'px', top: b.y + 'px', width: b.w + 'px', height: b.h + 'px' });
  const inArt = (src, b) => { const i = art.appendChild(img(src)); place(i, b); return i; };
  const [tx, ty] = small([51.6, 42.74]), [sx, sy] = small([31.63, 107.95]);
  const titleBox = { x: tx, y: ty, w: 248 / PROMO_K, h: 52 / PROMO_K };
  const subBox = { x: sx, y: sy, w: 287 / PROMO_K, h: 15 / PROMO_K };
  const title = inArt(REG + 'promo-title.png', titleBox);
  const sub = inArt(REG + 'promo-sub.png', subBox);
  const [titleTo, subTo] = w.giftCopy();
  const [giftTitle, giftSub] = [titleTo, subTo].map(c => {
    const i = inArt(c.src, c);
    i.style.opacity = 0;
    return i;
  });
  // where the big copy ends up: its glyphs over the small title / subtitle (the export pads them with a stroke and shadow)
  const titleEnd = { x: titleTo.x - 3.4, y: titleTo.y - 3.2, w: titleTo.w + 6.8, h: 20.8 };
  const subEnd = { x: subTo.x, y: subTo.y + 1.9, w: subTo.w, h: 6.7 };
  const shimmer = art.appendChild(document.createElement('div'));
  shimmer.className = 'ri-shimmer';
  place(shimmer, titleBox);
  Object.assign(shimmer.style, { webkitMaskImage: `url(${REG}promo-title.png)`, maskImage: `url(${REG}promo-title.png)` });
  screen.appendChild(host);

  // 02: wash and card rise, then the art pops in (glows first, then the objects, back to front), title, subtitle, a shimmer
  // the beats overlap so it reads as one motion: rise → pop → shimmer → straight into the shrink
  const T = 350, pop = { easing: 'cubic-bezier(0.3, 0.7, 0.4, 1)', fill: 'backwards' };
  fade.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 360, delay: T, easing: 'ease-out', fill: 'backwards' });
  card.animate([{ opacity: 0, transform: 'translateY(90px) scale(0.94)' }, { opacity: 1, transform: 'none' }],
    { duration: 560, delay: T + 40, easing: EASE_OUT, fill: 'backwards' });
  glow.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 560, delay: T + 160, easing: 'ease-out', fill: 'backwards' });
  pieces.forEach((p, i) => p.animate(i < 2
    ? [{ opacity: 0, transform: 'scale(0.6)' }, { opacity: 1, transform: 'none' }]
    : [{ opacity: 0, transform: 'translateY(14px) scale(0.5) rotate(-6deg)' }, { opacity: 1, transform: 'translateY(-3px) scale(1.1) rotate(2deg)', offset: 0.6 },
       { opacity: 1, transform: 'none' }], { ...pop, duration: i < 2 ? 560 : 520, delay: T + 200 + i * 60 }));
  title.animate([{ opacity: 0, transform: 'scale(0.8)' }, { opacity: 1, transform: 'scale(1.05)', offset: 0.6 }, { opacity: 1, transform: 'none' }],
    { ...pop, duration: 480, delay: T + 240 });
  sub.animate([{ opacity: 0, transform: 'translateY(8px)' }, { opacity: 1, transform: 'none' }], { duration: 380, delay: T + 360, easing: EASE_OUT, fill: 'backwards' });
  shimmer.animate([{ backgroundPosition: '100% 0', opacity: 1 }, { backgroundPosition: '0% 0', opacity: 1 }],
    { duration: 800, delay: T + 820, easing: 'cubic-bezier(0.45, 0, 0.25, 1)' });

  // 02 → 03: the card minimises into the My Lists card (after a hold, or straight away on tap)
  let shrinking = false;
  const hold = setTimeout(shrink, T + 1800);   // just after the shimmer has crossed the title
  card.addEventListener('click', e => { e.stopPropagation(); shrink(); });
  async function shrink() {
    if (shrinking) return;
    shrinking = true;
    clearTimeout(hold);
    [card, ...pieces, title, sub, glow, shimmer].forEach(n => n.getAnimations().forEach(a => a.finish()));
    const hr = host.getBoundingClientRect(), tr = w.el.getBoundingClientRect();
    const to = { x: (tr.left - hr.left) / phoneScale, y: (tr.top - hr.top) / phoneScale, w: 169.5, h: 136, r: 12 };
    const box = b => ({ left: b.x + 'px', top: b.y + 'px', width: b.w + 'px', height: b.h + 'px', ...(b.r != null && { borderRadius: b.r + 'px' }) });
    const ease = 'cubic-bezier(0.45, 0, 0.2, 1)', ms = 700;
    card.style.pointerEvents = 'none';
    await Promise.all([
      anim(card, [{ ...box(PROMO_CARD), boxShadow: '0 12px 40px rgba(29,37,57,.10)' }, { ...box(to), boxShadow: '0 0 0 rgba(29,37,57,0)' }], ms, ease),
      anim(art, [{ transform: big }, { transform: 'none' }], ms, ease),
      anim(glow, [{ opacity: 1 }, { opacity: 0 }], ms * 0.8, 'ease-out'),
      // big copy glides onto the small title and subtitle and hands over to them half-way down
      anim(title, [{ ...box(titleBox), opacity: 1 }, { opacity: 1, offset: 0.35 }, { ...box(titleEnd), opacity: 0 }], ms, ease),
      anim(sub, [{ ...box(subBox), opacity: 1 }, { opacity: 0, offset: 0.5 }, { ...box(subEnd), opacity: 0 }], ms, ease),
      anim(giftTitle, [{ opacity: 0 }, { opacity: 0, offset: 0.35 }, { opacity: 1, offset: 0.85 }, { opacity: 1 }], ms, 'linear'),
      anim(giftSub, [{ opacity: 0 }, { opacity: 0, offset: 0.45 }, { opacity: 1, offset: 0.9 }, { opacity: 1 }], ms, 'linear'),
      anim(fade, [{ opacity: 1 }, { opacity: 0 }], ms * 0.9, 'ease-in-out'),
    ]);
    // 03: the landed card (same art, same copy) hands over to the My Lists card; only the NEW tag fades in.
    // It rests for a second before carrying on, so no two transitions overlap.
    w.arrive('s03');
    host.remove();
    const later = (fn, ms) => setTimeout(() => { if (w.el.isConnected) fn(); }, ms);
    later(() => w.to('s04'), 1000);
    later(() => w.to('s05'), 1650);
  }
}

// Flow 2 explainer (Figma "Section 4", 8223:350234). 01 → 02: tapping "Create your gift registry" clears the
// sheet's cards while the sheet grows to its explainer height. 03: the "What is a Gift Registry" content pops in.
// 03 → 04: "Create Gift Registry" opens the white card to full screen while its hero lifts onto reg-1's (the
// card's hero is reg-1's shifted by 214pt, as in Figma), then reg-1 takes over with only its chrome and form
// arriving. Pieces are pt in the white card (Figma 03 minus the card's 12, 296 offset); s1-* are reg-1's own.
const XP = { top: 268, box: { h0: 276, h1: 478 }, lift: [12, 82] };
const XPD = REG + 'explainer/';
const XP_PIECES = {
  bg: [REG + 'bg', -12, -82, 375, 235],
  clip: [57.5, 36, 235, 125],
  arc: [REG + 's1-arc', 18.1, 23.78, 205, 54.33],
  art: EXP ? [R3 + 'art-occasion', -19.5, -24, 275, 153] : V3 ? [R3 + 'art-name', -19.5, -24, 275, 153] : [REG + 's1-art', -16, -24, 275, 153],
  title: [XPD + 'title', 56.5, 112.5, 238, 58.5],
  rows: [[XPD + 'row-1-v2', 20, 187, 311, 44], [XPD + 'row-2', 20, 263, 311, 44], [XPD + 'row-3', 20, 337, 311, 44]],
  nums: [[XPD + 'num-1', 9, 189, 44.5, 40], [XPD + 'num-2', 7, 265.5, 50, 40], [XPD + 'num-3', 7.5, 338.5, 48.5, 40]],
  seps: [[XPD + 'sep-1', 19.5, 246.5, 312, 1], [XPD + 'sep-2', 19.5, 322.5, 312, 1]],
};

function buildExplainer(box) {
  const wrap = box.appendChild(document.createElement('div'));
  wrap.className = 'xp-wrap';
  const put = (parent, [src, x, y, w, h], cls) => {
    const i = parent.appendChild(img(src + '.png'));
    if (cls) i.className = cls;
    Object.assign(i.style, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' });
    return i;
  };
  const n = {};
  n.bg = put(wrap, XP_PIECES.bg);
  const clip = wrap.appendChild(document.createElement('div'));
  clip.className = 'clip';
  const [cx, cy, cw, ch] = XP_PIECES.clip;
  Object.assign(clip.style, { left: cx + 'px', top: cy + 'px', width: cw + 'px', height: ch + 'px' });
  n.arc = put(clip, XP_PIECES.arc);
  n.art = put(clip, XP_PIECES.art, 'art');
  n.title = put(wrap, XP_PIECES.title);
  n.rows = XP_PIECES.rows.map(p => put(wrap, p));
  n.nums = XP_PIECES.nums.map(p => put(wrap, p));
  n.seps = XP_PIECES.seps.map(p => put(wrap, p));
  n.cta = wrap.appendChild(document.createElement('button'));
  n.cta.type = 'button';
  n.cta.className = 'xp-cta';
  n.cta.title = 'Create Gift Registry';
  n.cta.appendChild(img(XPD + 'cta.png'));
  n.cta.addEventListener('click', e => { e.stopPropagation(); morphToRegistry(); });
  return { wrap, n };
}

// 03: pieces pop in back to front — background, arc draws on, gift bounces up, title, then each step
// (number pops, copy slides in, divider fades), and the CTA rises last
function playExplainer({ n }, t0 = 0) {
  if (reduceMotion) return;
  const pop = { easing: 'cubic-bezier(0.3, 0.7, 0.4, 1)', fill: 'backwards' };
  n.bg.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 420, delay: t0, easing: 'ease-out', fill: 'backwards' });
  n.arc.animate([{ clipPath: 'inset(0 100% 0 0)', opacity: 0 }, { clipPath: 'inset(0 0 0 0)', opacity: 1 }],
    { duration: 620, delay: t0 + 80, easing: 'cubic-bezier(0.65, 0, 0.35, 1)', fill: 'backwards' });
  n.art.animate([{ opacity: 0, transform: 'translateY(18px) scale(0.5)' }, { opacity: 1, transform: 'translateY(-3px) scale(1.07)', offset: 0.6 },
    { opacity: 1, transform: 'none' }], { ...pop, duration: 660, delay: t0 + 160 });
  n.title.animate([{ opacity: 0, transform: 'translateY(10px) scale(0.94)' }, { opacity: 1, transform: 'none' }],
    { duration: 480, delay: t0 + 320, easing: EASE_OUT, fill: 'backwards' });
  n.rows.forEach((row, i) => {
    const d = t0 + 460 + i * 110;
    n.nums[i].animate([{ opacity: 0, transform: 'scale(0.4) rotate(-10deg)' }, { opacity: 1, transform: 'scale(1.12) rotate(3deg)', offset: 0.6 },
      { opacity: 1, transform: 'none' }], { ...pop, duration: 520, delay: d });
    row.animate([{ opacity: 0, transform: 'translateX(18px)' }, { opacity: 1, transform: 'none' }],
      { duration: 440, delay: d + 50, easing: EASE_OUT, fill: 'backwards' });
    n.seps[i]?.animate([{ opacity: 0, transform: 'scaleX(0.6)' }, { opacity: 1, transform: 'none' }],
      { duration: 380, delay: d + 120, easing: EASE_OUT, fill: 'backwards' });
  });
  n.cta.animate([{ opacity: 0, transform: 'translateY(16px)' }, { opacity: 1, transform: 'none' }],
    { duration: 480, delay: t0 + 820, easing: EASE_OUT, fill: 'backwards' });
}

// 01 → 02 → 03
// A plain white card stands in for the Create sheet's panel image so it can grow into the explainer
function mountExplainer(s) {
  const panelImg = s.panel.querySelector('[data-el="panel"]');
  const box = document.createElement('div');
  box.className = 'xp-box';
  panelImg.after(box);
  panelImg.style.visibility = 'hidden';
  s.explainer = { box, ...buildExplainer(box) };
  return box;
}

async function expandCreateSheet() {
  if (!sheet || sheet.id !== 'create' || sheet.explainer || busy) return;
  busy = true;
  const s = sheet;
  const { panel } = s;
  const cards = [...panel.querySelectorAll('.gl-card')];
  const box = mountExplainer(s);
  const ms = reduceMotion ? 1 : 560, grow = 'cubic-bezier(0.2, 0.9, 0.2, 1)';
  const h0 = panel.offsetHeight, h1 = 812 - XP.top;
  cards.forEach(c => anim(c, [{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateY(10px) scale(0.97)' }], 200, EASE_IN)
    .then(() => c.remove()));
  playExplainer(s.explainer, 260);
  await Promise.all([
    anim(panel, [{ height: h0 + 'px' }, { height: h1 + 'px' }], ms, grow),
    anim(box, [{ height: XP.box.h0 + 'px' }, { height: XP.box.h1 + 'px' }], ms, grow),
  ]);
  panel.style.height = h1 + 'px';
  box.style.height = XP.box.h1 + 'px';
  [panel, box].forEach(el => el.getAnimations().forEach(a => a.cancel()));
  busy = false;
}

// 03 → 04
async function morphToRegistry() {
  if (!sheet?.explainer || busy) return;
  busy = true;
  // the first step types straight away (flow 3): raise the device keyboard now, inside the tap
  if (keyboard.native && SCREENS[CREATE_START].focusOnEnter) focusProxy(SCREENS[CREATE_START].focusOnEnter);
  const s = sheet;
  sheet = null;
  const { box, wrap, n } = s.explainer;
  const from = current();
  // lift the white card out of the sheet into the full-screen layer, at the same spot
  const H = phone.offsetHeight;
  const top = H - s.panel.offsetHeight + 28;
  s.layer.appendChild(box);
  Object.assign(box.style, { left: '12px', top: top + 'px', height: XP.box.h1 + 'px' });
  // the first creation step is built underneath, hidden until the card has become it.
  // Flow 2's step opens on the explainer's own hero, so the hero lifts into place; flow 1's form has
  // no hero, so the card's contents fade away as it fills the screen and the form shows through
  const to = buildScreen(CREATE_START);
  to.ctx.morphed = true;
  to.el.style.visibility = 'hidden';
  phone.insertBefore(to.el, s.layer);
  stack.push(to);
  renderList();
  const ms = reduceMotion ? 1 : 680, ease = 'cubic-bezier(0.45, 0, 0.15, 1)';
  const away = [...n.rows, ...n.nums, ...n.seps, n.cta, ...(V2 ? [] : [wrap])];
  away.forEach(el => el.getAnimations().forEach(a => a.finish()));
  await Promise.all([
    anim(box, [{ left: '12px', top: top + 'px', width: '351px', height: XP.box.h1 + 'px', borderRadius: '24px' },
               { left: '0px', top: '0px', width: '375px', height: H + 'px', borderRadius: '0px' }], ms, ease),
    V2 && anim(wrap, [{ transform: 'none' }, { transform: `translate(${XP.lift[0]}px, ${XP.lift[1]}px)` }], ms, ease),
    ...away.map((el, i) => anim(el, [{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateY(14px)' }],
      reduceMotion ? 1 : 220 + i * 12, EASE_IN)),
    // the dim holds while the card grows over the page, so the page doesn't flash bright underneath
    anim(s.backdrop, [{ opacity: +getComputedStyle(s.backdrop).opacity }, { opacity: 0 }], ms, 'cubic-bezier(0.7, 0, 0.9, 0.6)'),
    anim(s.panel, [{ opacity: 1 }, { opacity: 0 }], reduceMotion ? 1 : 200, 'ease-out'),
    // experiments: "Gift Registry" lifts away over the last stretch of the grow, making room for "Occasion?"
    EXP && !reduceMotion && (() => {
      const a = n.title.animate([{ opacity: 1, transform: 'none' }, { opacity: 0, transform: 'translateY(-6px) scale(0.96)' }],
        { duration: 260, delay: ms - 260, easing: EASE_IN, fill: 'forwards' });
      setTimeout(() => { if (a.playState === 'running') a.finish(); }, ms + 150);   // as anim(): never lock navigation
      return a.finished.catch(() => {});
    })(),
  ]);
  // the landed card is reg-1's header pixel for pixel: reveal reg-1 under it and cross-fade the card away
  // (the title is the only piece that differs) while reg-1's chrome and form arrive
  to.el.style.visibility = '';
  if (from) from.el.classList.add('parked');
  SCREENS[CREATE_START].onEnter?.(to.ctx);
  if (EXP) to.ctx.nodes.regHero.popTitle(40);
  // the card and the step's header match pixel for pixel by now, so the card simply dissolves (slower in the
  // experiments, where the tiles and footer are arriving underneath)
  await anim(box, [{ opacity: 1 }, { opacity: 0 }], reduceMotion ? 1 : EXP ? 420 : V2 ? 260 : 340, EXP ? NM.EASE.fadeOut : 'ease-out');
  s.layer.remove();
  busy = false;
}

// reg-1 after the morph: hero and background are already there; the close, progress, form and footer arrive
function playMorphLanding(ctx) {
  if (reduceMotion) return;
  const screen = ctx.content.closest('.screen');
  const body = [...screen.querySelectorAll('[data-part="body"]')];
  [ctx.nodes.close, ctx.nodes.regProgress.el].forEach((el, i) => el?.animate(
    [{ opacity: 0, transform: 'scale(0.8)' }, { opacity: 1, transform: 'none' }],
    { duration: 360, delay: 60 + i * 60, easing: EASE_OUT, fill: 'backwards' }));
  ctx.nodes.regProgress.grow(0);
  body.forEach((el, i) => el.animate([{ opacity: 0, transform: 'translateY(16px)' }, { opacity: 1, transform: 'none' }],
    { duration: 460, delay: 80 + i * 60, easing: EASE_OUT, fill: 'backwards' }));
  ctx.nodes.regFooter.el.animate([{ transform: 'translateY(100%)' }, { transform: 'none' }],
    { duration: 520, delay: 120, easing: EASE_OUT, fill: 'backwards' });
}

// Closing the registry flow drops it away and uncovers the page it was opened from
// (My Lists when it was opened straight from the sidebar)
async function closeFlow() {
  if (busy) return;
  busy = true;
  dismissKeyboard();
  const from = current();
  const first = stack.findIndex(isStep);
  let to = stack[first - 1];
  stack.slice(first, -1).forEach(s => s.el.remove());
  if (to) {
    stack = stack.slice(0, first);
  } else {
    to = buildScreen('wishlist');
    phone.insertBefore(to.el, from.el);
    stack = [to];
    SCREENS.wishlist.onEnter?.(to.ctx);
  }
  to.el.classList.remove('parked');
  renderList();
  await Promise.all([
    anim(from.el, [{ transform: 'translateY(0)' }, { transform: 'translateY(100%)' }], POP_MS, EASE_OUT),
    anim(to.el, [{ '--dim': 0.12 }, { '--dim': 0 }], POP_MS, EASE_OUT),
  ]);
  from.el.remove();
  to.el.getAnimations().forEach(a => a.cancel());
  busy = false;
}

// Between registry steps the frame (background, close, progress, footer) stays put: the hero shrinks
// away and the form slides out, then the next step's hero pops in, its form slides in from the
// side it is heading and the progress bar fills on
async function stepTo(id) {
  busy = true;
  dismissKeyboard();
  // iOS only raises a keyboard for a focus made inside the tap: hold it on a stand-in field until the step is built
  if (keyboard.native && SCREENS[id].focusOnEnter) focusProxy(SCREENS[id].focusOnEnter);
  const from = current();
  await stepOut(from, 1);
  const to = buildScreen(id);
  phone.insertBefore(to.el, toastEl);
  stack.push(to);
  from.el.classList.add('parked');
  renderList();
  to.ctx.stepFrom = { dir: 1, progress: from.ctx.nodes.regProgress.width, delay: 0 };
  SCREENS[id].onEnter?.(to.ctx);
  busy = false;
}

async function stepBack() {
  busy = true;
  dismissKeyboard();
  const from = stack.pop();
  let to = current();
  if (keyboard.native && SCREENS[to.id].focusOnEnter) focusProxy(SCREENS[to.id].focusOnEnter);
  await stepOut(from, -1);
  if (EXP) {
    // experiments: the step comes back rebuilt with its answers, rather than un-parked (an un-parked step
    // could come back with its hero and form still hidden), and enters as it did the first time
    const fresh = buildScreen(to.id, to.ctx.state);
    fresh.ctx.stepFrom = { dir: -1, progress: from.ctx.nodes.regProgress.width, delay: 0 };
    phone.insertBefore(fresh.el, to.el);
    to.el.remove();
    stack[stack.length - 1] = to = fresh;
    from.el.remove();
    renderList();
    SCREENS[to.id].onEnter?.(to.ctx);
    busy = false;
    return;
  }
  to.el.classList.remove('parked');
  from.el.remove();
  renderList();
  playStep(to.ctx, { dir: -1, progress: from.ctx.nodes.regProgress.width, delay: 0 });
  // a typing step comes back with its keyboard up, as when it first opened
  if (SCREENS[to.id].refocus) {
    if (keyboard.native) SCREENS[to.id].refocus(to.ctx);
    else setTimeout(() => { if (current() === to) SCREENS[to.id].refocus(to.ctx); }, 120);
  }
  busy = false;
}

let proxyInput;
function focusProxy(mode) {
  proxyInput = proxyInput || Object.assign(document.createElement('input'), { className: 'kb-proxy', type: 'text' });
  proxyInput.setAttribute('inputmode', mode);
  if (!proxyInput.isConnected) document.body.appendChild(proxyInput);
  proxyInput.focus({ preventScroll: true });
}

function stepOut(entry, dir) {
  const scroller = entry.ctx.content.parentElement;
  if (scroller.scrollTop > 0) scroller.scrollTo({ top: 0, behavior: 'smooth' });
  return Promise.all([
    entry.ctx.nodes.regHero.hide(),
    ...[...entry.el.querySelectorAll('[data-part="body"]')].map(n =>
      anim(n, [{ opacity: 1, transform: 'none' }, { opacity: 0, transform: `translateX(${-28 * dir}px)` }], 200, EASE_IN)),
  ]);
}

// A registry step's entrance: hero pops, form fades up (first open) or slides in (between steps)
function playStep(ctx, opts = ctx.stepFrom || {}) {
  const { dir = 0, progress, delay = ctx.enterDelay ?? 80 } = opts;
  const body = [...ctx.content.closest('.screen').querySelectorAll('[data-part="body"]')];
  body.forEach(n => n.getAnimations().forEach(a => a.cancel()));
  const landed = ctx.nodes.regHero.play(delay);
  ctx.nodes.regProgress.grow(progress);
  if (reduceMotion) return;
  const enter = (n, i, at) => n.animate([{ opacity: 0, transform: dir ? `translateX(${28 * dir}px)` : 'translateY(14px)' },
    { opacity: 1, transform: 'none' }], { duration: 440, delay: at + i * 40, easing: EASE_OUT, fill: 'backwards' });
  if (!EXP) return body.forEach((n, i) => enter(n, i, delay + 140));
  // experiments: the header title lands first, then the step's content arrives under it
  body.forEach(n => { n.style.opacity = 0; });
  // (never wait more than 1.6s, so a stalled animation can't leave the form hidden)
  Promise.race([landed, new Promise(r => setTimeout(r, 1600))]).then(() => body.forEach((n, i) => {
    if (!n.isConnected) return;
    n.style.opacity = '';
    enter(n, i, 0);
  }));
}

// flow 4: cross-dissolve onto a screen that starts a new history (the finished registry flow can't be stepped back into)
async function fadeTo(id) {
  if (busy) return;
  busy = true;
  dismissKeyboard();
  const from = [...stack];
  const to = buildScreen(id);
  phone.insertBefore(to.el, toastEl);
  stack = [to];
  renderList();
  SCREENS[id].onEnter?.(to.ctx);
  await anim(to.el, [{ opacity: 0 }, { opacity: 1 }], reduceMotion ? 1 : 280, NM.EASE.fadeIn);
  to.el.getAnimations().forEach(a => a.cancel());
  from.forEach(s => s.el.remove());
  busy = false;
}

// The splash hands over to the registry page (Figma "Transitions into"): the art shrinks into the page's header art
// and the name glides up and settles as the header title. The page is built underneath with the same header, so once
// the splash matches it, it simply drops away. All coordinates are design pt, read from the page that was built.
async function splashInto(splash, id) {
  if (busy) return;
  busy = true;
  const from = current();
  const to = buildScreen(id);
  phone.insertBefore(to.el, from.el);
  stack = [to];
  renderList();
  SCREENS[id].onEnter?.(to.ctx);

  const ms = reduceMotion ? 1 : 560;
  const ease = NM.MOVE;   // the noon spring: quick, no visible bounce
  const art = splash.querySelector('.es-art');
  const full = art.querySelector('.full'), head = art.querySelector('.head');
  const hb = to.ctx.nodes['header-bg-notitle'];
  const H = hb.offsetHeight || 196;
  head.src = hb.src;
  // the target title: its name and date line, in frame coordinates
  const target = to.ctx.nodes.listTitle.el;
  const tName = target.querySelector('h2'), tWhen = target.querySelector('.when');
  const name = splash.querySelector('.es-name'), when = splash.querySelector('.es-title .when');
  const title = splash.querySelector('.es-title');
  const box = n => { let x = 0, y = 0; for (let e = n; e && e !== to.el && e !== splash; e = e.offsetParent) { x += e.offsetLeft; y += e.offsetTop; } return { x, y, w: n.offsetWidth, h: n.offsetHeight }; };
  const a = box(name), b = box(tName);
  const k = parseFloat(getComputedStyle(tName).fontSize) / parseFloat(getComputedStyle(name.querySelector('h2')).fontSize);
  const nameTo = `translate(${b.x + b.w / 2 - (a.x + a.w / 2)}px, ${b.y + (b.h - a.h * k) / 2 - a.y}px) scale(${k})`;
  const wa = when && box(when), wb = tWhen && box(tWhen);
  target.style.visibility = 'hidden';
  if (target.classList.contains('dark')) title.classList.add('to-dark');
  // the page's own content stays out of sight until the closing art has passed it, then rises in below the header
  const body = [...to.el.querySelectorAll('.scroller > .content > *')].filter(n => !n.contains(target) && n !== hb && !n.contains(hb));
  body.forEach(n => n.animate([{ opacity: 0 }, { opacity: 0 }], { duration: ms * 0.3, fill: 'backwards' }));
  playEnter(to, ms * 0.3);

  await Promise.all([
    // the frame closes up to the header (rounded bottom corners land with it)
    anim(art, [{ clipPath: 'inset(0 0 0 0 round 0 0 0 0)' }, { clipPath: `inset(0 0 ${812 - H}px 0 round 0 0 24px 24px)` }], ms, ease),
    // the full-screen art drifts up as the frame closes; the header art (sized to the closing frame, so the two
    // always cover it edge to edge) dissolves in over the middle of the move
    anim(full, [{ transform: 'none', opacity: 1 }, { transform: 'translateY(-36px) scale(1.04)', opacity: 1, offset: 0.25 },
      { transform: 'translateY(-90px) scale(1.08)', opacity: 0, offset: 0.75 }, { transform: 'translateY(-110px) scale(1.1)', opacity: 0 }], ms, ease),
    anim(head, [{ opacity: 0, height: '812px' }, { opacity: 0, offset: 0.2 }, { opacity: 1, offset: 0.7 }, { opacity: 1, height: H + 'px' }], ms, ease),
    anim(name, [{ transform: 'none' }, { transform: nameTo }], ms, ease),
    // the white outline and gold word ease away into the page's plain black title
    anim(name.querySelector('.stroke'), [{ opacity: 1 }, { opacity: 0 }], ms * 0.5, 'ease-out'),
    anim(name.querySelector('.fill'), [{ opacity: 1 }, { opacity: 0 }], ms * 0.6, 'ease-in-out'),
    anim(name.querySelector('.plain'), [{ opacity: 0 }, { opacity: 1 }], ms * 0.6, 'ease-in-out'),
    wa && wb ? anim(when, [{ transform: 'none' }, { transform: `translate(${wb.x - wa.x}px, ${wb.y - wa.y}px)` }], ms, ease)
             : when && anim(when, [{ opacity: 0.9 }, { opacity: 0 }], ms * 0.4, 'ease-out'),
  ]);
  // splash now sits exactly on the page's header and title: swap them in the same frame, then let the
  // page's status bar and back button come up
  target.style.visibility = '';
  title.style.visibility = 'hidden';
  await anim(splash, [{ opacity: 1 }, { opacity: 0 }], reduceMotion ? 1 : 120, 'ease-out');
  from.el.remove();
  busy = false;
}

function jump(id, sheetId, explain) {
  dismissKeyboard(true);
  if (sheet) { sheet.layer.remove(); sheet = null; }
  phone.querySelectorAll('.screen').forEach(el => el.remove());
  const to = buildScreen(id);
  phone.insertBefore(to.el, toastEl);
  stack = [to];
  busy = false;
  renderList();
  to.el.animate([{ opacity: 0 }, { opacity: 1 }], { duration: reduceMotion ? 1 : 220, easing: 'ease-out' });
  playEnter(to, 80);
  SCREENS[id].onEnter?.(to.ctx);
  if (sheetId) openSheet(sheetId).then(() => { if (explain) expandCreateSheet(); });
}

/* ---------- bottom sheet ---------- */

async function openSheet(id, opts = {}) {
  if (sheet || busy) return;
  busy = true;
  dismissKeyboard();
  const def = SHEETS[id];
  const layer = document.createElement('div');
  layer.className = 'sheet-layer';
  const backdrop = document.createElement('div');
  backdrop.className = 'backdrop';
  const panel = document.createElement('div');
  panel.className = 'sheet';
  // sheets rise from the frame's bottom edge, whatever the frame height
  panel.style.bottom = '0';
  panel.style.height = 812 - def.top + 'px';
  const ctx = makeCtx(id);
  // a sheet either lists image layers or builds its own live content
  if (def.build) panel.appendChild(def.build(opts).el);
  else for (const l of def.layers) {
    const node = l.build ? l.build(ctx) : buildLayer('sheet', 'sheet', l, ctx, 0, def.top);
    panel.appendChild(node);
  }
  layer.append(backdrop, panel);
  phone.insertBefore(layer, toastEl);
  sheet = { id, layer, panel, backdrop };
  // { explain } opens the Create sheet straight on the Gift Registry explainer, which pops in as it rises
  if (opts.explain) {
    panel.querySelectorAll('.gl-card').forEach(c => c.remove());
    panel.style.height = 812 - XP.top + 'px';
    mountExplainer(sheet).style.height = XP.box.h1 + 'px';
    playExplainer(sheet.explainer, SHEET_IN_MS * 0.35);
  }
  backdrop.addEventListener('click', () => closeSheet());
  enableDrag(panel, backdrop);
  renderList();

  const h = panel.offsetHeight || 812 - def.top;
  await Promise.all([
    anim(backdrop, [{ opacity: 0 }, { opacity: 1 }], SHEET_IN_MS * 0.8, 'ease-out'),
    anim(panel, [{ transform: `translateY(${h}px)` }, { transform: 'translateY(0)' }], SHEET_IN_MS, EASE_OUT),
  ]);
  [panel, backdrop].forEach(n => n.getAnimations().forEach(a => { a.commitStyles(); a.cancel(); }));
  busy = false;
}

async function closeSheet(alongside = false) {
  if (!sheet) return;
  if (busy && !alongside) return;
  const s = sheet;
  sheet = null;
  if (!alongside) busy = true;
  renderList();
  const h = s.panel.offsetHeight;
  const fromY = new DOMMatrixReadOnly(getComputedStyle(s.panel).transform).m42;
  const fromOpacity = +getComputedStyle(s.backdrop).opacity;
  s.panel.getAnimations().forEach(a => a.cancel());
  s.backdrop.getAnimations().forEach(a => { a.commitStyles(); a.cancel(); });
  await Promise.all([
    anim(s.backdrop, [{ opacity: fromOpacity }, { opacity: 0 }], SHEET_OUT_MS, 'ease-in'),
    anim(s.panel, [{ transform: `translateY(${fromY}px)` }, { transform: `translateY(${h}px)` }], SHEET_OUT_MS, EASE_IN),
  ]);
  s.layer.remove();
  if (!alongside) busy = false;
  // dismissed with nothing behind it: hand back to the host app
  if (EMBED) setTimeout(() => { if (!sheet && current()?.id === 'host') toHost({ type: 'close' }); }, 30);
}

// Drag the sheet down to dismiss
function enableDrag(panel, backdrop) {
  let startY = null, lastY = 0, lastT = 0, vy = 0, dragging = false, justDragged = false;
  const h = () => panel.offsetHeight;
  // swallow the click that follows a drag
  panel.addEventListener('click', e => { if (justDragged) e.stopPropagation(); }, true);
  panel.addEventListener('pointerdown', e => {
    if (busy) return;
    // a scrolled list inside the sheet scrolls back up instead of dragging the sheet down
    if (e.target.closest('[data-scroll]')?.scrollTop > 0) return;
    startY = e.clientY; lastY = e.clientY; lastT = e.timeStamp; vy = 0; dragging = false;
  });
  panel.addEventListener('pointermove', e => {
    if (startY === null) return;
    const dy = Math.max(0, (e.clientY - startY) / phoneScale);   // screen px → design pt
    // capture only once a drag starts; capturing on press would retarget taps to the panel
    if (!dragging && dy > 6) { dragging = true; panel.setPointerCapture(e.pointerId); }
    if (!dragging) return;
    vy = (e.clientY - lastY) / Math.max(1, e.timeStamp - lastT);
    lastY = e.clientY; lastT = e.timeStamp;
    panel.style.transform = `translateY(${dy}px)`;
    backdrop.style.opacity = 1 - dy / h();
  });
  panel.addEventListener('pointerup', e => {
    if (startY === null) return;
    const dy = Math.max(0, (e.clientY - startY) / phoneScale);   // screen px → design pt
    startY = null;
    if (!dragging) return;
    justDragged = true;
    setTimeout(() => { justDragged = false; }, 0);
    if (dy > h() * 0.3 || vy > 0.6) return closeSheet();
    panel.animate([{ transform: `translateY(${dy}px)` }, { transform: 'translateY(0)' }], { duration: 300, easing: EASE_OUT });
    backdrop.animate([{ opacity: backdrop.style.opacity }, { opacity: 1 }], { duration: 300, easing: EASE_OUT });
    panel.style.transform = 'translateY(0)';
    backdrop.style.opacity = 1;
  });
}

/* ---------- sidebar ---------- */

function renderList() {
  toHost({ type: 'screen', id: current()?.id, sheet: sheet?.id ?? null });
  if (current()?.id === 'wishlist' && !sheet) loadHostRegistries();
  list.innerHTML = '';
  const cur = current()?.id;
  MENU.forEach((m, i) => {
    const li = document.createElement('li');
    const b = document.createElement('button');
    b.innerHTML = `<span class="n">${String(i + 1).padStart(2, '0')}</span><span></span>`;
    b.lastChild.textContent = m.label;
    const active = m.screen === cur && (m.sheet || null) === (sheet?.id || null);
    b.setAttribute('aria-current', active);
    b.onclick = () => jump(m.screen, m.sheet, m.explain);
    li.appendChild(b);
    list.appendChild(li);
  });
}

// Warm the image cache so pushes never show half-loaded layers
function preload() {
  if (V4) ['birthday', 'wedding', 'babyshower', 'housewarming', 'other'].forEach(k => { new Image().src = `assets/v4/splash-${k}.jpg`; });
  for (const [id, def] of Object.entries({ ...SCREENS, sheet: SHEETS.create })) {
    const walk = layers => layers.forEach(l => {
      if (l.items) return walk(l.items);
      if (l.widget || l.build) return;
      [l.el, ...Object.values(l.states || {})].forEach(n => { new Image().src = (n === l.el && l.src) || `assets/${l.dir || id}/${n}.png`; });
    });
    walk(def.layers);
  }
  ['date-field-empty', 'calendar-sheet', 'calendar-confirm-enabled', 'checkbox-checked', 'required-asterisk',
    'track-binoculars', 'track-headline', 'address-sheet', 'address-card-work', 'address-card-work-selected', 'address-card-ayush', 'address-card-ayush-selected', 'icon-briefcase']
    .forEach(n => { new Image().src = `assets/add-details/${n}.png`; });
  OCCASION_TILES.forEach(o => { new Image().src = `assets/gift-form/occasions/${o.key}.png`; });
  if (V4) V4_TILES.forEach(o => { new Image().src = `assets/gift-form/occasions-v5/${o.key}.png`; });
  if (V2) Object.values(REG_HEROES).flatMap(h => [h.title, ...h.pieces]).filter(Boolean).map(p => p[0]).filter(n => !n.includes('/'))
    .concat(['icon-calendar', 'sheet-title', 'mylists-title', 'mylists-sub', 'promo-title', 'promo-sub'],
      Object.keys(REG_TILE_THEME).flatMap(k => ['bg', 's1-arc', 's1-title', 's2-arc', 's2-title', 's3-arc', 's3-title'].map(n => `${n}-${k}`)))
    .forEach(n => { new Image().src = REG + n + '.png'; });
  if (V3 || EXP) ['t-name', 't-occasion', 't-date', 'chip', 'numpad', 'art-name', 'art-occasion', 'art-date', 'spark-date', 'd-addr', 'd-note', 'd-instr-head', 'd-instr']
    .flatMap(n => [n, ...(/^(t-|chip)/.test(n) ? Object.keys(REG_BUTTON).map(k => `${n}-${k}`) : [])])
    .forEach(n => { new Image().src = R3 + n + '.png'; });
  if (V2) Object.keys(REG_BUTTON).forEach(k => ['checkbox-checked', 'calendar-confirm-enabled'].forEach(n => { new Image().src = regAsset(n, k); }));
}

document.querySelectorAll('#flows a').forEach((a, i) => a.setAttribute('aria-current', i + 1 === FLOW));
if (EXP) {
  document.documentElement.classList.add('exp');
  // kit skeleton: any art that hasn't loaded yet sits on a shimmering placeholder of its own box (every band
  // in phase), which fades as the image arrives
  const waitFor = i => {
    if (i.complete && i.naturalWidth) return;
    requestAnimationFrame(() => {
      if (i.complete && i.naturalWidth) return;
      if (!i.isConnected || i.offsetWidth < 24 || i.offsetHeight < 24) return;
      const cs = getComputedStyle(i);
      if (+cs.opacity === 0 || cs.visibility === 'hidden' || cs.position !== 'absolute') return;
      const ph = document.createElement('div');
      ph.className = 'nm-skeleton img-wait';
      Object.assign(ph.style, { left: i.offsetLeft + 'px', top: i.offsetTop + 'px', width: i.offsetWidth + 'px', height: i.offsetHeight + 'px' });
      i.before(ph);
      const done = () => { ph.style.opacity = 0; setTimeout(() => ph.remove(), 220); };
      i.addEventListener('load', done, { once: true });
      i.addEventListener('error', done, { once: true });
    });
  };
  new MutationObserver(list => list.forEach(m => m.addedNodes.forEach(n => {
    if (n.nodeType !== 1) return;
    if (n.tagName === 'IMG') waitFor(n); else n.querySelectorAll?.('img').forEach(waitFor);
  }))).observe(phone, { childList: true, subtree: true });
  // the kit's tap haptic with every press
  phone.addEventListener('pointerdown', e => { if (e.target.closest('button, .tap, .occ')) NM.haptic('tap'); }, true);
  document.getElementById('flows').style.display = 'none';
  document.querySelector('.side h1').textContent = `Gift Registry · V${FLOW}`;
  document.querySelector('.side h1 + p').textContent = EXP === 1
    ? 'Flow 4 with one question per screen: occasion, name, date, delivery.'
    : 'Flow 4 with one question per screen: occasion, whose it is, the registry’s name, date, delivery.';
  document.title = `V${FLOW} · Gifting Registry`;
}
toggle.addEventListener('change', () => phone.classList.toggle('show-hotspots', toggle.checked));
document.getElementById('restart').onclick = () => jump('start');
document.addEventListener('keydown', e => {
  if (e.target.closest('input, textarea')) return;
  if (e.key === 'h' || e.key === 'H') { toggle.checked = !toggle.checked; toggle.dispatchEvent(new Event('change')); }
  if (e.key === 'ArrowLeft' || e.key === 'Escape') back();
});

// Phones (≤ 600px wide) get the prototype full-screen: the 375pt design is scaled to the screen
// width, and the frame is made as tall as the visible screen in design points (scrolling content
// and bottom-docked layers absorb the difference from 812). Desktop keeps the sidebar and bezel.
// The phone already shows a real status bar, so the design's own (top 44pt) is hidden and cropped
// off by shifting the frame up. The frame follows the visual viewport, so when the native keyboard
// opens it shrinks to the space above it and pinned CTAs move up with it.
const STATUS_CROP = 44;
let phoneScale = 1;
function fitToScreen() {
  const vv = window.visualViewport;
  const vw = vv?.width || innerWidth;
  const vh = vv?.height || innerHeight;
  const mobile = EMBED || Math.min(vw, screen.width) <= 600;
  document.documentElement.classList.toggle('mobile', mobile);
  if (mobile) {
    phoneScale = vw / 375;
    phone.style.top = (vv?.offsetTop || 0) + 'px';
    // embedded, the frame starts under the host's status bar instead of the browser's
    // the design's own 44pt status area sits under the host's status bar (no gap above the header art)
    const top = EMBED ? (EMBED_TOP ?? STATUS_CROP * phoneScale) : 0;
    phone.style.transform = `translateY(${top - STATUS_CROP * phoneScale}px) scale(${phoneScale})`;
    phone.style.height = (vh - top) / phoneScale + STATUS_CROP + 'px';
  } else {
    phoneScale = 1;
    phone.style.top = '';
    phone.style.transform = '';
    phone.style.height = '';
  }
}
fitToScreen();
addEventListener('resize', fitToScreen);
addEventListener('orientationchange', fitToScreen);
window.visualViewport?.addEventListener('resize', fitToScreen);
window.visualViewport?.addEventListener('scroll', fitToScreen);

preload();
// &start=list-created (the noon app's empty registry): that registry's empty state, from &name= &occasion= &date=
// (yyyy-mm-dd); its Back hands control back to the host instead of going to the wishlist
if (EMBED_START === 'list-created') {
  const q = new URLSearchParams(location.search), d = q.get('date');
  createdList = { name: q.get('name') || 'My Gift Registry', occasion: q.get('occasion') || null,
    date: d ? new Date(+d.slice(0, 4), +d.slice(5, 7) - 1, +d.slice(8, 10)) : null };
  addEventListener('click', e => {
    if (!e.target.closest?.('[data-el="close"]')) return;
    e.stopPropagation(); e.preventDefault();
    toHost({ type: 'back' });
  }, true);
}
// &start=ftux: My Lists with the "What is a Gift Registry" card up; &start=first: the flow's first creation step
if (EMBED_START === 'ftux') jump('wishlist', 'create', true);
else if (EMBED_START === 'first') jump(CREATE_START);
else if (EMBED_START) jump(EMBED_START in SCREENS ? EMBED_START : 'start');
else if (EMBED) {
  SCREENS.host = { name: 'Gift Registry', bg: 'transparent', layers: [] };
  jump('host');
  openSheet('create', { explain: new URLSearchParams(location.search).has('explain') });
} else jump('start');
</script>
